name: Render retro contribution graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_contribution_graph.py"
      - ".github/workflows/contribution-graph.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the latest 30-day graph
        run: python scripts/generate_contribution_graph.py
        env:
          GITHUB_USERNAME: 28BEANS
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution graph"
          git push
